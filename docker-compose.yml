services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: uccergel-web:latest
    container_name: uccergel-web
    restart: unless-stopped
    ports:
      # Host 80 -> container 3000. Domain'e HTTP ile doğrudan bağlanır.
      - "80:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    # Secret'lar .env dosyasından okunur (image'a gömülmez).
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
