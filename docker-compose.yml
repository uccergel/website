services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: uccergel-web:latest
    container_name: uccergel-web
    restart: unless-stopped
    # NOT: Host portu (80/443) doğrudan yayınlanmıyor. Dokploy kendi
    # Traefik reverse proxy'si ile 80/443'ü kullanır. Domain yönlendirmesi
    # Dokploy arayüzünden (Domains sekmesi) container portu 3000'e yapılır.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    # Secret'lar .env dosyasından okunur (image'a gömülmez).
    env_file:
      - .env
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # Dokploy'un Traefik'inin de bağlı olduğu dış ağ. Traefik bu ağ üzerinden
  # container'a 3000 portundan erişir.
  dokploy-network:
    external: true
